workflows:
  android-apk:
    name: CA Foundation Study Tracker APK
    max_build_duration: 30

    scripts:
      - name: Extract Android project
        script: |
          set -e

          mkdir -p buildsrc

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          echo "Using ZIP: $ZIP_FILE"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d buildsrc

          PROJECT_DIR=$(find buildsrc -type f -name "gradlew" -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "Project found at: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - buildsrc/**/app/build/outputs/apk/debug/*.apk
