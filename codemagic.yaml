workflows:
  android-apk:
    name: CA Foundation Study Tracker V7
    max_build_duration: 60
    instance_type: mac_mini_m2

    scripts:
      - name: Extract V7 Android project
        script: |
          set -e
          mkdir -p buildsrc
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "CAFoundationStudyTracker_V7_FINAL.zip" -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: CAFoundationStudyTracker_V7_FINAL.zip not found"
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d buildsrc
          PROJECT_DIR=$(find buildsrc -type f -name "gradlew" -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - buildsrc/**/app/build/outputs/apk/debug/*.apk
